pre-commit:
    commands:
        prettier:
            glob: '*.{js,ts,md,json,jsonc,yml,yaml,css,html}'
            run: npx prettier --write {staged_files}
            stage_fixed: true
        eslint-no-warning:
            glob: '*.{js,ts}'
            run: npx eslint --fix --max-warnings=0 {staged_files}
